; ---------------------------------------------------------------------------
; Keep derived data off C: (see README "Caches").
; The default graph uses Zen, whose store is shared by every UE 5.7 project on the
; machine (on C:). Don't move it with [Zen.AutoLaunch] DataPath: UE treats that as a
; migration of the machine-wide default and deletes the old store. This project skips
; Zen and uses a plain file-system DDC inside the project folder (ignored by git).
; ---------------------------------------------------------------------------

[InstalledDerivedDataBackendGraph]
Hierarchy=(Type=Hierarchical, Inner=Pak, Inner=CompressedPak, Inner=EnginePak, Inner=Local)
Local=(Type=FileSystem, ReadOnly=false, Clean=false, Flush=false, PurgeTransient=true, DeleteUnused=true, UnusedFileAge=14, FoldersToClean=-1, Path="%GAMEDIR%DerivedDataCache/Local", EnvPathOverride=UE-LocalDataCachePath, EditorOverrideSetting=LocalDerivedDataCache)

; Development builds log everything GFC does (adb logcat tag "UE"). Shipping strips Verbose.
[Core.Log]
LogGFCApi=Verbose
